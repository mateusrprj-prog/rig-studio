name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find, validate and recover ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -type f -name '*.zip' -not -path './.git/*' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No .zip archive was found in the repository."
            exit 1
          fi

          mkdir -p extracted repaired
          for i in "${!zips[@]}"; do
            source="${zips[$i]}"
            archive="$source"
            echo "Checking archive: $source"

            if ! unzip -tq "$source" >/dev/null 2>&1; then
              echo "::warning::ZIP validation failed. Attempting to reconstruct its directory."
              fixed="repaired/archive-$((i + 1)).zip"
              rm -f "$fixed"
              if ! zip -FF "$source" --out "$fixed" >/dev/null 2>&1; then
                echo "::error::Could not recover ZIP archive: $source"
                exit 1
              fi
              if ! unzip -tq "$fixed" >/dev/null 2>&1; then
                echo "::error::Recovered archive still fails ZIP integrity validation: $source"
                exit 1
              fi
              archive="$fixed"
            fi

            dest="extracted/archive-$((i + 1))"
            mkdir -p "$dest"
            unzip -q "$archive" -d "$dest"
          done

      - name: Locate Android or Capacitor project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = Path("extracted")
          gradle_projects = sorted(p.parent for p in base.rglob("gradlew") if p.is_file())

          if len(gradle_projects) == 1:
              kind, root = "gradle", gradle_projects[0]
          elif len(gradle_projects) > 1:
              raise SystemExit(
                  "More than one Android Gradle project was found: "
                  + ", ".join(str(p) for p in gradle_projects)
              )
          else:
              config_names = {
                  "capacitor.config.ts",
                  "capacitor.config.js",
                  "capacitor.config.json",
              }
              capacitor_configs = [
                  p for p in base.rglob("capacitor.config.*")
                  if p.name in config_names and (p.parent / "package.json").is_file()
              ]

              if len(capacitor_configs) != 1:
                  raise SystemExit(
                      "Expected exactly one Capacitor project "
                      "(capacitor.config.* plus package.json); "
                      f"found {len(capacitor_configs)}."
                  )
              kind, root = "capacitor", capacitor_configs[0].parent

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"kind={kind}\n")
              output.write(f"root={root.resolve()}\n")

          print(f"Detected {kind} project at {root}")
          PY

        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          echo "===== MAIN.TS ====="
          cat src/main.ts
          echo "===== PACKAGE ====="
          cat package.json

      - name: Add bone pose testing controls and publish RIG STUDIO v0.3.0
        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: ${{ steps.locate.outputs.root }}
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.root }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.ts")
          source = main.read_text(encoding="utf-8")

          panel_anchor = '      <div id="boneList" class="bone-list"><span class="muted">Nenhum osso criado.</span></div>'
          panel = panel_anchor + '''
                <div class="section-title">TESTE DE DEFORMAÇÃO</div>
                <div id="posePanel" style="display:grid;gap:10px;padding:12px;background:#1b2230;border:1px solid #303b4e;border-radius:12px">
                  <label style="font-size:12px;color:#aab6c9">OSSO SELECIONADO
                    <select id="poseBoneSelect" disabled style="display:block;width:100%;margin-top:6px;padding:10px;background:#111722;color:#eef3fb;border:1px solid #3b465b;border-radius:8px"></select>
                  </label>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Rotação X <output id="poseXValue">0°</output></label>
                    <input id="poseX" type="range" min="-90" max="90" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Rotação Y <output id="poseYValue">0°</output></label>
                    <input id="poseY" type="range" min="-90" max="90" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Rotação Z <output id="poseZValue">0°</output></label>
                    <input id="poseZ" type="range" min="-90" max="90" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <div style="display:flex;gap:8px">
                    <button id="resetBonePose" class="secondary" disabled style="flex:1">RESETAR OSSO</button>
                    <button id="resetAllPose" class="secondary" disabled style="flex:1">RESETAR POSE</button>
                  </div>
                  <small id="poseHint" style="color:#93a2b8;line-height:1.4">Gere o Auto Rig humanoide para testar a deformação da malha.</small>
                </div>'''
          if panel_anchor not in source:
              raise SystemExit("Could not find the rig hierarchy panel anchor.")
          if 'id="posePanel"' not in source:
              source = source.replace(panel_anchor, panel, 1)

          state_anchor = "let autoRigged = false;"
          state = state_anchor + """
          let poseBones: THREE.Bone[] = [];
          let selectedPoseBone: THREE.Bone | null = null;
          let restPoseRotations = new Map<THREE.Bone, THREE.Euler>();
          """
          if state_anchor not in source:
              raise SystemExit("Could not find autoRigged state declaration.")
          if "let restPoseRotations" not in source:
              source = source.replace(state_anchor, state, 1)

          refresh_anchor = "const restoreAutoRigMeshes = () => {"
          pose_helpers = """const updatePoseSliders = () => {
            const bone = selectedPoseBone;
            const values = bone ? [bone.rotation.x, bone.rotation.y, bone.rotation.z].map(v => Math.round(THREE.MathUtils.radToDeg(v))) : [0, 0, 0];
            (['X', 'Y', 'Z'] as const).forEach((axis, index) => {
              const slider = $<HTMLInputElement>('pose' + axis);
              const output = $('pose' + axis + 'Value');
              slider.value = String(values[index]);
              output.textContent = values[index] + '°';
            });
          };

          const syncPosePanel = () => {
            const select = $<HTMLSelectElement>('poseBoneSelect');
            const enabled = autoRigged && !!rootBone;
            poseBones = [];
            if (rootBone) rootBone.traverse(object => {
              if ((object as THREE.Bone).isBone) poseBones.push(object as THREE.Bone);
            });
            select.innerHTML = '';
            poseBones.forEach((bone, index) => {
              const option = document.createElement('option');
              option.value = String(index);
              option.textContent = bone.name;
              select.appendChild(option);
            });
            if (!selectedPoseBone || !poseBones.includes(selectedPoseBone)) selectedPoseBone = poseBones[0] || null;
            if (selectedPoseBone) select.value = String(poseBones.indexOf(selectedPoseBone));
            select.disabled = !enabled || poseBones.length === 0;
            (['X', 'Y', 'Z'] as const).forEach(axis => {
              $<HTMLInputElement>('pose' + axis).disabled = !enabled || !selectedPoseBone;
            });
            $<HTMLButtonElement>('resetBonePose').disabled = !enabled || !selectedPoseBone;
            $<HTMLButtonElement>('resetAllPose').disabled = !enabled;
            $('poseHint').textContent = enabled
              ? 'Arraste os controles para girar um osso e observar como os pesos automáticos deformam a malha. Use ângulos pequenos para avaliar o resultado.'
              : 'Gere o Auto Rig humanoide para testar a deformação da malha.';
            updatePoseSliders();
          };

          const applyPoseRotation = (axis: 'x' | 'y' | 'z', value: string) => {
            if (!selectedPoseBone || !autoRigged) return;
            selectedPoseBone.rotation[axis] = THREE.MathUtils.degToRad(Number(value));
            $('pose' + axis.toUpperCase() + 'Value').textContent = value + '°';
            selectedPoseBone.updateWorldMatrix(true, true);
            if (skeletonHelper) skeletonHelper.update();
          };

          const resetSelectedPoseBone = () => {
            if (!selectedPoseBone) return;
            const rest = restPoseRotations.get(selectedPoseBone);
            if (rest) selectedPoseBone.rotation.copy(rest);
            updatePoseSliders();
            selectedPoseBone.updateWorldMatrix(true, true);
            if (skeletonHelper) skeletonHelper.update();
          };

          const resetEntirePose = () => {
            restPoseRotations.forEach((rotation, bone) => bone.rotation.copy(rotation));
            updatePoseSliders();
            rootBone?.updateWorldMatrix(true, true);
            if (skeletonHelper) skeletonHelper.update();
            toast('Pose original restaurada.');
          };

          """
          if refresh_anchor not in source:
              raise SystemExit("Could not find restoreAutoRigMeshes insertion point.")
          if "const syncPosePanel" not in source:
              source = source.replace(refresh_anchor, pose_helpers + refresh_anchor, 1)

          # Snapshot the bind/rest rotations only after successful automatic skinning.
          success_anchor = "    autoRigged = true;"
          if success_anchor not in source:
              raise SystemExit("Could not find successful Auto Rig state assignment.")
          if "restPoseRotations = new Map" not in source:
              source = source.replace(
                  success_anchor,
                  success_anchor + """
              restPoseRotations = new Map(orderedBones.map(bone => [bone, bone.rotation.clone()]));
              selectedPoseBone = hips;""",
                  1
              )

          # Enable the pose panel after Auto Rig and keep it in sync with clear/reset.
          auto_refresh_anchor = "    updateStats(); refreshBoneList();"
          auto_refresh_replacement = "    updateStats(); refreshBoneList(); syncPosePanel();"
          if auto_refresh_anchor not in source:
              raise SystemExit("Could not find Auto Rig UI refresh call.")
          source = source.replace(auto_refresh_anchor, auto_refresh_replacement, 1)

          remove_anchor = "  rootBone = null; lastBone = null; boneCount = 0;"
          remove_replacement = remove_anchor + """
            selectedPoseBone = null;
            poseBones = [];
            restPoseRotations.clear();
            syncPosePanel();"""
          if remove_anchor not in source:
              raise SystemExit("Could not find rig reset state line.")
          if "restPoseRotations.clear()" not in source:
              source = source.replace(remove_anchor, remove_replacement, 1)

          # Add functional pose controls to the existing event wiring.
          event_anchor = "$('autoRigBtn').addEventListener('click', createHumanoidRig);"
          events = event_anchor + """
          $('poseBoneSelect').addEventListener('change', event => {
            const index = Number((event.target as HTMLSelectElement).value);
            selectedPoseBone = poseBones[index] || null;
            updatePoseSliders();
          });
          (['X', 'Y', 'Z'] as const).forEach(axis => {
            $('pose' + axis).addEventListener('input', event => {
              applyPoseRotation(axis.toLowerCase() as 'x' | 'y' | 'z', (event.target as HTMLInputElement).value);
            });
          });
          $('resetBonePose').addEventListener('click', resetSelectedPoseBone);
          $('resetAllPose').addEventListener('click', resetEntirePose);
          syncPosePanel();"""
          if event_anchor not in source:
              raise SystemExit("Could not find Auto Rig event listener.")
          if "resetEntirePose" not in source[source.find(event_anchor):]:
              source = source.replace(event_anchor, events, 1)

          main.write_text(source, encoding="utf-8")
          print("Added interactive bone selection, X/Y/Z pose rotation, per-bone reset and full-pose reset.")
          PY

          cd "$PROJECT_ROOT"
          zip -qr "$GITHUB_WORKSPACE/RIG_STUDIO_v0.3.0_source.zip" . \
            -x "node_modules/*" "*/node_modules/*" "dist/*" "*/dist/*" "android/*" "*/android/*" ".git/*" "*/.git/*"
          cd "$GITHUB_WORKSPACE"
          unzip -tq RIG_STUDIO_v0.3.0_source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f RIG_STUDIO_v0.2.0_source.zip RIG_STUDIO_v0.2.1_source.zip || true
          git add RIG_STUDIO_v0.3.0_source.zip
          git commit -m "Release RIG STUDIO v0.3.0 interactive bone pose testing [skip ci]"
          git push origin HEAD:main

      - name: Build Capacitor Android project
        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build native Android project
        if: steps.locate.outputs.kind == 'gradle'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-studio-debug-apk
          path: |
            extracted/**/build/outputs/apk/**/*.apk
            extracted/**/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find, validate and recover ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -type f -name '*.zip' -not -path './.git/*' ! -name 'RIG_STUDIO_v0.2.0_source.zip' ! -name 'RIG_STUDIO_v0.2.1_source.zip' ! -name 'RIG_STUDIO_v0.3.0_source.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No .zip archive was found in the repository."
            exit 1
          fi

          mkdir -p extracted repaired
          for i in "${!zips[@]}"; do
            source="${zips[$i]}"
            archive="$source"
            echo "Checking archive: $source"

            if ! unzip -tq "$source" >/dev/null 2>&1; then
              echo "::warning::ZIP validation failed. Attempting to reconstruct its directory."
              fixed="repaired/archive-$((i + 1)).zip"
              rm -f "$fixed"
              if ! zip -FF "$source" --out "$fixed" >/dev/null 2>&1; then
                echo "::error::Could not recover ZIP archive: $source"
                exit 1
              fi
              if ! unzip -tq "$fixed" >/dev/null 2>&1; then
                echo "::error::Recovered archive still fails ZIP integrity validation: $source"
                exit 1
              fi
              archive="$fixed"
            fi

            dest="extracted/archive-$((i + 1))"
            mkdir -p "$dest"
            unzip -q "$archive" -d "$dest"
          done

      - name: Locate Android or Capacitor project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = Path("extracted")
          gradle_projects = sorted(p.parent for p in base.rglob("gradlew") if p.is_file())

          if len(gradle_projects) == 1:
              kind, root = "gradle", gradle_projects[0]
          elif len(gradle_projects) > 1:
              raise SystemExit(
                  "More than one Android Gradle project was found: "
                  + ", ".join(str(p) for p in gradle_projects)
              )
          else:
              config_names = {
                  "capacitor.config.ts",
                  "capacitor.config.js",
                  "capacitor.config.json",
              }
              capacitor_configs = [
                  p for p in base.rglob("capacitor.config.*")
                  if p.name in config_names and (p.parent / "package.json").is_file()
              ]

              if len(capacitor_configs) != 1:
                  raise SystemExit(
                      "Expected exactly one Capacitor project "
                      "(capacitor.config.* plus package.json); "
                      f"found {len(capacitor_configs)}."
                  )
              kind, root = "capacitor", capacitor_configs[0].parent

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"kind={kind}\n")
              output.write(f"root={root.resolve()}\n")

          print(f"Detected {kind} project at {root}")
          PY

      - name: Build Humanoid Control Rig and IK tools for RIG STUDIO v0.4.0
        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: \${{ steps.locate.outputs.root }}
        env:
          PROJECT_ROOT: \${{ steps.locate.outputs.root }}
          GITHUB_WORKSPACE: \${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("src/main.ts")
          source = main.read_text(encoding="utf-8")

          # Add a dedicated IK control panel below the direct bone-pose test panel.
          panel_anchor = '      <div class="bottom-actions"><button id="resetViewBtn"'
          panel = '''      <div class="section-title">HUMANOID CONTROL RIG · BETA</div>
                <div id="ikPanel" style="display:grid;gap:10px;padding:12px;background:#1b2230;border:1px solid #303b4e;border-radius:12px">
                  <label style="font-size:12px;color:#aab6c9">CONTROLE ATIVO
                    <select id="ikControlSelect" disabled style="display:block;width:100%;margin-top:6px;padding:10px;background:#111722;color:#eef3fb;border:1px solid #3b465b;border-radius:8px"></select>
                  </label>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Alvo X <output id="ikXValue">0</output></label>
                    <input id="ikX" type="range" min="-100" max="100" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Alvo Y <output id="ikYValue">0</output></label>
                    <input id="ikY" type="range" min="-100" max="100" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <div style="display:grid;gap:5px">
                    <label style="display:flex;justify-content:space-between;font-size:12px;color:#c5d0df">Alvo Z <output id="ikZValue">0</output></label>
                    <input id="ikZ" type="range" min="-100" max="100" step="1" value="0" disabled style="width:100%;accent-color:#62e6c5">
                  </div>
                  <button id="resetIKTarget" class="secondary" disabled>RESTAURAR ALVO</button>
                  <small id="ikHint" style="color:#93a2b8;line-height:1.4">Gere o Auto Rig para criar controladores de mãos e pés. Selecione um controle e mova seu alvo para testar o IK.</small>
                </div>
          '''
          if 'id="ikPanel"' not in source:
              if panel_anchor not in source:
                  raise SystemExit("Could not find the existing workspace bottom-actions panel.")
              source = source.replace(panel_anchor, panel + panel_anchor, 1)

          # State for a distinct control rig: these target objects do not deform the mesh.
          state_anchor = "let autoRigged = false;"
          state_block = state_anchor + """
          type IKLimbControl = {
            id: string;
            label: string;
            base: THREE.Bone;
            middle: THREE.Bone;
            end: THREE.Bone;
            target: THREE.Mesh;
            restTarget: THREE.Vector3;
            upperLength: number;
            lowerLength: number;
            pole: THREE.Vector3;
            height: number;
          };
          let controlRigGroup: THREE.Group | null = null;
          let ikChains: IKLimbControl[] = [];
          let selectedIKChain: IKLimbControl | null = null;
          """
          if state_anchor not in source:
              raise SystemExit("Could not locate the rig state declaration.")
          if "type IKLimbControl =" not in source:
              source = source.replace(state_anchor, state_block, 1)

          helpers_anchor = "const restoreAutoRigMeshes = () => {"
          helpers = r"""const getBoneWorldPosition = (bone: THREE.Bone) => {
            bone.updateWorldMatrix(true, false);
            return bone.getWorldPosition(new THREE.Vector3());
          };

          const setBoneWorldPosition = (bone: THREE.Bone, worldPosition: THREE.Vector3) => {
            const parent = bone.parent;
            if (!parent) return;
            parent.updateWorldMatrix(true, false);
            bone.position.copy(parent.worldToLocal(worldPosition.clone()));
            bone.updateMatrix();
            bone.updateWorldMatrix(false, true);
          };

          const solveTwoBoneIK = (chain: IKLimbControl) => {
            const start = getBoneWorldPosition(chain.base);
            const target = chain.target.position.clone();
            const delta = target.clone().sub(start);
            const rawDistance = delta.length();
            if (rawDistance < 1e-7) return;

            const minimumReach = Math.abs(chain.upperLength - chain.lowerLength) + 1e-5;
            const maximumReach = Math.max(minimumReach, chain.upperLength + chain.lowerLength - 1e-5);
            const distance = THREE.MathUtils.clamp(rawDistance, minimumReach, maximumReach);
            const direction = delta.normalize();

            let pole = chain.pole.clone().addScaledVector(direction, -chain.pole.dot(direction));
            if (pole.lengthSq() < 1e-8) {
              pole = new THREE.Vector3(0, 0, 1).cross(direction);
              if (pole.lengthSq() < 1e-8) pole = new THREE.Vector3(0, 1, 0).cross(direction);
            }
            pole.normalize();

            const a = chain.upperLength;
            const b = chain.lowerLength;
            const along = (a * a + distance * distance - b * b) / (2 * distance);
            const height = Math.sqrt(Math.max(0, a * a - along * along));
            const elbowOrKnee = start.clone()
              .addScaledVector(direction, along)
              .addScaledVector(pole, height);
            const reachableEnd = start.clone().addScaledVector(direction, distance);

            setBoneWorldPosition(chain.middle, elbowOrKnee);
            setBoneWorldPosition(chain.end, reachableEnd);
            chain.base.updateWorldMatrix(true, true);
            chain.middle.updateWorldMatrix(true, true);
            if (skeletonHelper) skeletonHelper.updateMatrixWorld(true);
          };

          const updateIKSliders = () => {
            const chain = selectedIKChain;
            const enabled = autoRigged && !!chain;
            const offsets = chain ? chain.target.position.clone().sub(chain.restTarget) : new THREE.Vector3();
            const maxOffset = chain ? chain.height * 0.25 : 1;
            (['X', 'Y', 'Z'] as const).forEach((axis, index) => {
              const component = index === 0 ? offsets.x : index === 1 ? offsets.y : offsets.z;
              const value = Math.round(THREE.MathUtils.clamp(component / maxOffset, -1, 1) * 100);
              $<HTMLInputElement>('ik' + axis).value = String(value);
              $('ik' + axis + 'Value').textContent = String(value);
              $<HTMLInputElement>('ik' + axis).disabled = !enabled;
            });
            $<HTMLSelectElement>('ikControlSelect').disabled = !enabled;
            $<HTMLButtonElement>('resetIKTarget').disabled = !enabled;
            $('ikHint').textContent = enabled
              ? 'Controlador independente do esqueleto de deformação. Ajuste o alvo: o solver de dois ossos reposiciona cotovelo ou joelho preservando os comprimentos.'
              : 'Gere o Auto Rig para criar controladores de mãos e pés. Selecione um controle e mova seu alvo para testar o IK.';
          };

          const selectIKChain = (id: string) => {
            selectedIKChain = ikChains.find(chain => chain.id === id) || null;
            if (selectedIKChain) $<HTMLSelectElement>('ikControlSelect').value = selectedIKChain.id;
            ikChains.forEach(chain => {
              const material = chain.target.material as THREE.MeshBasicMaterial;
              material.opacity = chain === selectedIKChain ? 1 : 0.72;
            });
            updateIKSliders();
          };

          const syncIKPanel = () => {
            const select = $<HTMLSelectElement>('ikControlSelect');
            select.innerHTML = '';
            ikChains.forEach(chain => {
              const option = document.createElement('option');
              option.value = chain.id;
              option.textContent = chain.label;
              select.appendChild(option);
            });
            if (!selectedIKChain || !ikChains.includes(selectedIKChain)) selectedIKChain = ikChains[0] || null;
            if (selectedIKChain) select.value = selectedIKChain.id;
            select.disabled = !autoRigged || ikChains.length === 0;
            updateIKSliders();
          };

          const buildHumanoidControlRig = (height: number) => {
            if (!model || !rootBone) throw new Error('O esqueleto de deformação não está pronto.');
            if (controlRigGroup) scene.remove(controlRigGroup);
            controlRigGroup = new THREE.Group();
            controlRigGroup.name = 'RIG_STUDIO_CONTROL_RIG';
            scene.add(controlRigGroup);
            ikChains = [];

            const specs = [
              { id: 'arm_L', label: 'Mão esquerda · IK', base: 'Shoulder_L', middle: 'UpperArm_L', end: 'Forearm_L', color: 0x62e6c5 },
              { id: 'arm_R', label: 'Mão direita · IK', base: 'Shoulder_R', middle: 'UpperArm_R', end: 'Forearm_R', color: 0xffb86b },
              { id: 'leg_L', label: 'Pé esquerdo · IK', base: 'UpperLeg_L', middle: 'LowerLeg_L', end: 'Foot_L', color: 0x62a8ff },
              { id: 'leg_R', label: 'Pé direito · IK', base: 'UpperLeg_R', middle: 'LowerLeg_R', end: 'Foot_R', color: 0xd28cff }
            ];

            for (const spec of specs) {
              const base = rootBone.getObjectByName(spec.base) as THREE.Bone | undefined;
              const middle = rootBone.getObjectByName(spec.middle) as THREE.Bone | undefined;
              const end = rootBone.getObjectByName(spec.end) as THREE.Bone | undefined;
              if (!base || !middle || !end) continue;

              const startPosition = getBoneWorldPosition(base);
              const middlePosition = getBoneWorldPosition(middle);
              const endPosition = getBoneWorldPosition(end);
              const upperLength = startPosition.distanceTo(middlePosition);
              const lowerLength = middlePosition.distanceTo(endPosition);
              if (upperLength < 1e-5 || lowerLength < 1e-5) continue;

              const axis = endPosition.clone().sub(startPosition).normalize();
              const pole = middlePosition.clone().sub(startPosition);
              pole.addScaledVector(axis, -pole.dot(axis));
              if (pole.lengthSq() < 1e-8) pole.set(0, 0, 1);
              pole.normalize();

              const material = new THREE.MeshBasicMaterial({
                color: spec.color,
                depthTest: false,
                transparent: true,
                opacity: 1
              });
              const target = new THREE.Mesh(
                new THREE.TorusGeometry(height * 0.026, height * 0.004, 8, 28),
                material
              );
              target.name = 'CTRL_' + spec.id;
              target.userData.ikChainId = spec.id;
              target.position.copy(endPosition);
              target.renderOrder = 1000;
              controlRigGroup.add(target);

              const center = new THREE.Mesh(
                new THREE.SphereGeometry(height * 0.007, 12, 10),
                new THREE.MeshBasicMaterial({ color: spec.color, depthTest: false })
              );
              center.name = 'CTRL_CENTER_' + spec.id;
              target.add(center);

              ikChains.push({
                id: spec.id,
                label: spec.label,
                base,
                middle,
                end,
                target,
                restTarget: endPosition.clone(),
                upperLength,
                lowerLength,
                pole,
                height
              });
            }

            if (ikChains.length === 0) {
              throw new Error('Não foi possível criar os quatro controles IK.');
            }
            selectedIKChain = ikChains[0];
            syncIKPanel();
            toast('Control Rig criado: ' + ikChains.length + ' alvos IK.');
          };

          const updateIKTargetFromSliders = () => {
            const chain = selectedIKChain;
            if (!chain || !autoRigged) return;
            const maxOffset = chain.height * 0.25;
            const x = Number($<HTMLInputElement>('ikX').value) / 100 * maxOffset;
            const y = Number($<HTMLInputElement>('ikY').value) / 100 * maxOffset;
            const z = Number($<HTMLInputElement>('ikZ').value) / 100 * maxOffset;
            chain.target.position.copy(chain.restTarget).add(new THREE.Vector3(x, y, z));
            solveTwoBoneIK(chain);
            updateIKSliders();
          };

          const resetIKTarget = () => {
            if (!selectedIKChain) return;
            selectedIKChain.target.position.copy(selectedIKChain.restTarget);
            solveTwoBoneIK(selectedIKChain);
            updateIKSliders();
            toast('Alvo IK restaurado.');
          };

          """
          if helpers_anchor not in source:
              raise SystemExit("Could not find the rig helper insertion point.")
          if "const buildHumanoidControlRig" not in source:
              source = source.replace(helpers_anchor, helpers + helpers_anchor, 1)

          # Create controls only after all deform meshes have been bound successfully.
          success_anchor = "    autoRigged = true;"
          if success_anchor not in source:
              raise SystemExit("Could not find the successful Auto Rig state assignment.")
          if "buildHumanoidControlRig(height)" not in source:
              source = source.replace(success_anchor, success_anchor + "\n    buildHumanoidControlRig(height);", 1)

          # Remove control objects and solver state together with the deform rig.
          remove_anchor = "  restoreAutoRigMeshes();"
          remove_replacement = """  restoreAutoRigMeshes();
            if (controlRigGroup) { scene.remove(controlRigGroup); controlRigGroup = null; }
            ikChains = [];
            selectedIKChain = null;
            syncIKPanel();"""
          if remove_anchor not in source:
              raise SystemExit("Could not find rig cleanup hook.")
          if "selectedIKChain = null;" not in source:
              source = source.replace(remove_anchor, remove_replacement, 1)

          # Attach UI events to the target controls.
          event_anchor = "$('autoRigBtn').addEventListener('click', createHumanoidRig);"
          events = event_anchor + """
          $('ikControlSelect').addEventListener('change', event => {
            selectIKChain((event.target as HTMLSelectElement).value);
          });
          (['X', 'Y', 'Z'] as const).forEach(axis => {
            $('ik' + axis).addEventListener('input', updateIKTargetFromSliders);
          });
          $('resetIKTarget').addEventListener('click', resetIKTarget);
          syncIKPanel();"""
          if event_anchor not in source:
              raise SystemExit("Could not find the Auto Rig event wiring.")
          if "resetIKTarget').addEventListener" not in source:
              source = source.replace(event_anchor, events, 1)

          # Allow tapping visible controllers in the viewport to select them.
          pointer_anchor = """renderer.domElement.addEventListener('pointerdown', event => {
            if (!addBoneMode || !model) return;
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObject(model, true);"""
          pointer_replacement = """renderer.domElement.addEventListener('pointerdown', event => {
            if (!model) return;
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (controlRigGroup) {
              const controlHits = raycaster.intersectObjects(controlRigGroup.children, true);
              if (controlHits.length) {
                let object: THREE.Object3D | null = controlHits[0].object;
                while (object && typeof object.userData.ikChainId !== 'string') object = object.parent;
                if (object) {
                  selectIKChain(String(object.userData.ikChainId));
                  return;
                }
              }
            }
            if (!addBoneMode) return;
            const hits = raycaster.intersectObject(model, true);"""
          if pointer_anchor not in source:
              raise SystemExit("Could not find existing viewport pointer handler.")
          if "const controlHits = raycaster.intersectObjects" not in source:
              source = source.replace(pointer_anchor, pointer_replacement, 1)

          # Keep helper updates compatible with the Three.js SkeletonHelper API.
          source = source.replace("skeletonHelper.update()", "skeletonHelper.updateMatrixWorld(true)")

          main.write_text(source, encoding="utf-8")
          print("Added separate humanoid control rig, four two-bone IK targets, tap-to-select controls and mobile target sliders.")
          PY

          cd "$PROJECT_ROOT"
          zip -qr "$GITHUB_WORKSPACE/RIG_STUDIO_v0.4.0_source.zip" . \
            -x "node_modules/*" "*/node_modules/*" "dist/*" "*/dist/*" "android/*" "*/android/*" ".git/*" "*/.git/*"
          cd "$GITHUB_WORKSPACE"
          unzip -tq RIG_STUDIO_v0.4.0_source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f RIG_STUDIO_v0.3.0_source.zip || true
          git add RIG_STUDIO_v0.4.0_source.zip
          git commit -m "Release RIG STUDIO v0.4.0 humanoid control rig and IK [skip ci]"
          git push origin HEAD:main

      - name: Build Capacitor Android project
        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build native Android project
        if: steps.locate.outputs.kind == 'gradle'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-studio-debug-apk
          path: |
            extracted/**/build/outputs/apk/**/*.apk
            extracted/**/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

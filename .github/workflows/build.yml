name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find, validate and recover ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -type f -name '*.zip' -not -path './.git/*' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No .zip archive was found in the repository."
            exit 1
          fi

          mkdir -p extracted repaired
          for i in "${!zips[@]}"; do
            source="${zips[$i]}"
            archive="$source"
            echo "Checking archive: $source"

            if ! unzip -tq "$source" >/dev/null 2>&1; then
              echo "::warning::ZIP validation failed. Attempting to reconstruct its directory."
              fixed="repaired/archive-$((i + 1)).zip"
              rm -f "$fixed"
              if ! zip -FF "$source" --out "$fixed" >/dev/null 2>&1; then
                echo "::error::Could not recover ZIP archive: $source"
                exit 1
              fi
              if ! unzip -tq "$fixed" >/dev/null 2>&1; then
                echo "::error::Recovered archive still fails ZIP integrity validation: $source"
                exit 1
              fi
              archive="$fixed"
            fi

            dest="extracted/archive-$((i + 1))"
            mkdir -p "$dest"
            unzip -q "$archive" -d "$dest"
          done

      - name: Locate Android or Capacitor project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          base = Path("extracted")
          gradle_projects = sorted(p.parent for p in base.rglob("gradlew") if p.is_file())

          if len(gradle_projects) == 1:
              kind, root = "gradle", gradle_projects[0]
          elif len(gradle_projects) > 1:
              raise SystemExit(
                  "More than one Android Gradle project was found: "
                  + ", ".join(str(p) for p in gradle_projects)
              )
          else:
              config_names = {
                  "capacitor.config.ts",
                  "capacitor.config.js",
                  "capacitor.config.json",
              }
              capacitor_configs = [
                  p for p in base.rglob("capacitor.config.*")
                  if p.name in config_names and (p.parent / "package.json").is_file()
              ]

              if len(capacitor_configs) != 1:
                  raise SystemExit(
                      "Expected exactly one Capacitor project "
                      "(capacitor.config.* plus package.json); "
                      f"found {len(capacitor_configs)}."
                  )
              kind, root = "capacitor", capacitor_configs[0].parent

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"kind={kind}\n")
              output.write(f"root={root.resolve()}\n")

          print(f"Detected {kind} project at {root}")
          PY

      - name: Raise model import limit to 100 MB and publish updated source ZIP
        if: steps.locate.outputs.kind == 'capacitor'
        env:
          PROJECT_ROOT: ${{ steps.locate.outputs.root }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          patterns = [
              re.compile(r'((?:MAX_(?:MODEL|FILE|UPLOAD)_SIZE)\s*=\s*)\d+(?=\s*\*\s*1024\s*\*\s*1024)', re.I),
              re.compile(r'((?:MAX_(?:MODEL|FILE|UPLOAD)_SIZE)_MB\s*=\s*)\d+', re.I),
              re.compile(r'(file\.size\s*>\s*)\d+(?=\s*\*\s*1024\s*\*\s*1024)', re.I),
          ]
          changed = []
          extensions = {".ts", ".tsx", ".js", ".jsx", ".html"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in {"node_modules", "dist", "android", ".git"} for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for pattern in patterns:
                  updated = pattern.sub(lambda m: m.group(1) + "100", updated)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit(
                  "No explicit MAX_MODEL_SIZE/MAX_FILE_SIZE/MAX_UPLOAD_SIZE or "
                  "file.size MB limit was found. No source ZIP was published; "
                  "the import limit needs code inspection instead of guessing."
              )
          print("Raised the detected model/file import limit to 100 MB in:")
          print("\\n".join(changed))
          PY

          cd "$PROJECT_ROOT"
          zip -qr "$GITHUB_WORKSPACE/RIG_STUDIO_v0.2.1_source.zip" . \\
            -x "node_modules/*" "dist/*" "android/.gradle/*" ".git/*"
          cd "$GITHUB_WORKSPACE"
          unzip -tq RIG_STUDIO_v0.2.1_source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RIG_STUDIO_v0.2.1_source.zip
          git commit -m "Release RIG STUDIO v0.2.1 with 100 MB model import limit [skip ci]"
          git push origin HEAD:main

      - name: Build Capacitor Android project
        if: steps.locate.outputs.kind == 'capacitor'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build native Android project
        if: steps.locate.outputs.kind == 'gradle'
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-studio-debug-apk
          path: |
            extracted/**/build/outputs/apk/**/*.apk
            extracted/**/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
